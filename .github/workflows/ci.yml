name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and type check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            extensions/*/package-lock.json
            tools/typecheck/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install locked dependencies
        run: |
          for dir in extensions/*/ tools/typecheck/; do
            if [ -f "${dir}package-lock.json" ]; then
              npm ci --prefix "$dir" --ignore-scripts --no-audit --no-fund
            fi
          done

      # Real-SDK suites resolve Pi from the global npm root / PATH. Keep the
      # version pinned to the type-check toolchain's SDK pin.
      - name: Install pinned Pi SDK
        run: |
          version=$(node -p "require('./tools/typecheck/package.json').devDependencies['@earendil-works/pi-coding-agent']")
          npm install -g --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@${version}"

      # Tests launch headless only; playwright and patchright share one build.
      - name: Install headless Chromium
        timeout-minutes: 10
        working-directory: extensions/pi-browser-capture
        run: |
          node_modules/.bin/playwright install --only-shell chromium
          node_modules/.bin/patchright install --only-shell chromium

      - name: Type check
        run: npm run typecheck

      - name: Node tests
        run: npm test

      - name: Python tests
        run: python -m pytest -q tests
